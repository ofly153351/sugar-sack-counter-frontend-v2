name: Deploy Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /root/-sack/-sack-counter-frontend-v2
            git fetch --all

            OLD_PKG_HASH="$(git rev-parse HEAD:package.json 2>/dev/null || true)"
            OLD_LOCK_HASH="$(git rev-parse HEAD:package-lock.json 2>/dev/null || true)"

            git reset --hard origin/main

            NEW_PKG_HASH="$(git rev-parse HEAD:package.json 2>/dev/null || true)"
            NEW_LOCK_HASH="$(git rev-parse HEAD:package-lock.json 2>/dev/null || true)"

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            nvm use 20.20

            if [ ! -d .next ] || [ "$OLD_PKG_HASH" != "$NEW_PKG_HASH" ] || [ "$OLD_LOCK_HASH" != "$NEW_LOCK_HASH" ]; then
              npm install
            fi

            npm run build

            if pm2 list | grep -q "frontend"; then
              pm2 restart frontend
            else
              pm2 start npm --name frontend -- start
            fi
